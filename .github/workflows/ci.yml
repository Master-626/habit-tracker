name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.8', architecture: x64}
          - {os: ubuntu-24.04, python: '3.9', architecture: x64}
          - {os: ubuntu-24.04, python: '3.10', architecture: x64}
          - {os: ubuntu-24.04, python: '3.11', architecture: x64}
          - {os: ubuntu-24.04, python: '3.12', architecture: x64}
          - {os: ubuntu-24.04, python: '3.13', architecture: x64}
          - {os: ubuntu-24.04, python: '3.14', architecture: x64}
          - {os: windows-2022, python: '3.12', architecture: x64}
          - {os: macos-15, python: '3.12', architecture: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
          check-latest: true
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: python -m pip install 'click==8.0.0' 'rich==13.0.0'
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/habit_tracker-0.1.0-py3-none-any.whl
      - run: python scripts/smoke_installed.py
      - run: python -m pip install --force-reinstall dist/habit_tracker-0.1.0.tar.gz
      - run: python scripts/smoke_installed.py
