[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "habit-tracker"
version = "0.1.0"
description = "A habit tracking CLI with streaks and reports."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0", "rich>=13.0.0"]

[project.scripts]
habit = "habit_tracker.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/habit-tracker"

[project.optional-dependencies]
dev = ["pytest>=7,<9", "build>=1,<2", "ruff>=0.8,<0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/habit_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
