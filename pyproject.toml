[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "habit-tracker"
version = "0.1.0"
description = "A habit tracking CLI with streaks and reports."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0", "rich>=13.0.0"]

[project.scripts]
habit = "habit_tracker.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/habit-tracker"
